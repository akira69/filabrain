<div id="filament-batches" class="fm-admin-page">
    <section class="fm-card batch-overview" aria-labelledby="batch-title">
      <header class="batch-row">
        <h2 id="batch-title" data-i18n="researchBatches.title">Research batches</h2>
        <a href="?tab=batches" class="fm-btn fm-btn-outline" data-batch-history-link hidden data-i18n="researchBatches.allBatches">All batches</a>
      </header>
      <p class="batch-muted" data-i18n="researchBatches.retention">Reports are kept for 30 days after a batch finishes or is canceled.</p>
      <p data-batch-message role="status" class="batch-message" data-i18n="common.loading">Loading…</p>
      <div data-batch-history hidden></div>
    </section>
    <div data-batch-workspace hidden>
      <div class="fm-card batch-row batch-toolbar">
        <p data-batch-progress role="status"></p>
        <div class="batch-actions">
          <button type="button" class="fm-btn fm-btn-outline" data-action="cancel" data-i18n="researchBatches.cancel">Cancel batch</button>
          <button type="button" class="fm-btn fm-btn-primary" data-action="apply" data-i18n="researchBatches.apply">Apply approved changes</button>
        </div>
      </div>
      <div class="batch-layout">
        <nav class="fm-card" aria-labelledby="batch-queue-title">
          <h2 id="batch-queue-title" data-i18n="researchBatches.queue">Review queue</h2>
          <ol data-batch-queue></ol>
        </nav>
        <section class="fm-card" data-batch-review></section>
      </div>
      <section class="fm-card batch-section" data-batch-groups hidden></section>
      <section class="fm-card batch-section" data-batch-report hidden></section>
    </div>
    <dialog class="fm-form-dialog fm-form-dialog-wide" aria-labelledby="batch-confirm-heading">
      <div class="fm-section-header fm-form-dialog-header"><h2 id="batch-confirm-heading"></h2></div>
      <div class="fm-section-body">
        <p data-batch-preview-message role="status" class="batch-message"></p>
        <div data-batch-preview></div>
        <div class="fm-modal-actions">
          <button type="button" class="fm-btn fm-btn-outline" data-action="close" autofocus data-i18n="common.cancel">Cancel</button>
          <button type="button" class="fm-btn fm-btn-primary" data-action="confirm"></button>
        </div>
      </div>
    </dialog>
  </div>
