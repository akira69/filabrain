<section class="research-chat fm-card" aria-labelledby="research-chat-title">
    <header class="fm-section-header chat-header">
      <h2 id="research-chat-title" data-i18n="filaBrain.chat">Chat</h2>
      <details class="chat-history" data-chat-history hidden>
        <summary data-i18n="filaBrain.chatHistory">History</summary>
        <div class="fm-card chat-history-list" data-chat-history-list></div>
      </details>
      <button type="button" class="fm-btn chat-new" data-editor-settings hidden aria-label="Model &amp; MCP settings" title="Model &amp; MCP settings">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M10.4 3h3.2l.6 2.3 1.6.9 2.3-.6 1.6 2.8-1.7 1.7v1.8l1.7 1.7-1.6 2.8-2.3-.6-1.6.9-.6 2.3h-3.2l-.6-2.3-1.6-.9-2.3.6-1.6-2.8 1.7-1.7v-1.8L4.3 8.4l1.6-2.8 2.3.6 1.6-.9z"/><circle cx="12" cy="11" r="2.6"/></svg>
      </button>
      <button type="button" class="fm-btn fm-btn-outline chat-new" data-chat-new aria-label="New chat" title="New chat" data-i18n-aria-label="filaBrain.chatNew" data-i18n-title="filaBrain.chatNew" disabled>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7M10 14l1-4 7-7a2.1 2.1 0 0 1 3 3l-7 7z"/></svg>
      </button>
    </header>

    <div class="chat-transcript" data-chat-transcript tabindex="0" role="region" data-i18n-aria-label="filaBrain.chatTranscript">
      <div class="chat-setup" data-chat-setup hidden>
        <h3 data-i18n="filaBrain.chatConnectModel">Connect a chat model</h3>
        <p data-chat-setup-hint></p>
        <button type="button" class="fm-btn fm-btn-primary" data-chat-setup-button data-i18n="filaBrain.chatSetupButton" hidden>Set up a model</button>
      </div>
      <div class="chat-prompts" data-chat-prompts hidden>
        <h3 data-i18n="filaBrain.chatWelcome">What are you printing?</h3>
        <button type="button" class="fm-btn fm-btn-outline" data-chat-prompt="chatPromptMaterial" data-i18n="filaBrain.chatChipMaterial">Compare materials</button>
        <button type="button" class="fm-btn fm-btn-outline" data-chat-prompt="chatPromptDrying" data-i18n="filaBrain.chatChipDrying">Drying filament</button>
        <button type="button" class="fm-btn fm-btn-outline" data-chat-prompt="chatPromptQuality" data-i18n="filaBrain.chatChipQuality">Troubleshoot a print</button>
        <button type="button" class="fm-btn fm-btn-outline" data-chat-prompt="chatPromptAdd" data-i18n="filaBrain.chatChipAdd">Add a filament</button>
      </div>
      <div data-chat-research-input hidden></div>
      <div class="chat-log" data-chat-log role="log" data-i18n-aria-label="filaBrain.chatTranscript"></div>
      <div data-chat-research-results hidden></div>
    </div>

    <div class="chat-composer">
      <p data-chat-status class="fm-field-hint" role="status" data-i18n="common.loading">Loading…</p>
      <form class="message-composer" data-chat-form hidden>
        <textarea class="fm-input" name="message" rows="2" maxlength="2000" placeholder="Ask FilaBrain…" data-i18n-aria-label="filaBrain.chatQuestion" data-i18n-placeholder="filaBrain.chatPlaceholder"></textarea>
        <div class="chat-toolbar">
          <!-- model-picker -->
          <button type="submit" class="fm-btn fm-btn-primary chat-send" disabled data-i18n-aria-label="filaBrain.chatSend">
            <svg data-send-icon aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6" /></svg>
            <svg data-stop-icon aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3" /></svg>
          </button>
        </div>
      </form>
    </div>
  </section>
